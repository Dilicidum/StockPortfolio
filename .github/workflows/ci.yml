name: CI

# Pull requests only, and nothing here may need Azure credentials: a fork's PR cannot read secrets and would go falsely green.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/*.trx'
          if-no-files-found: ignore

  web:
    name: SPA build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for SPA
        id: spa
        run: |
          if [ -f src/Web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/Web/package.json not found — skipping SPA build and tests."
          fi

      - name: Set up Node
        if: steps.spa.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install
        if: steps.spa.outputs.present == 'true'
        run: npm ci
        working-directory: src/Web

      - name: Check locale parity
        # There is no fallback to English, so a key missing from Ukrainian renders as a raw key path in the UI.
        if: steps.spa.outputs.present == 'true'
        run: node scripts/check-locale-parity.mjs
        working-directory: src/Web

      - name: Build
        if: steps.spa.outputs.present == 'true'
        # No VITE_BASE or VITE_API_BASE_URL: baking either into a PR build hides the bug the environment indirection prevents.
        run: npm run build
        working-directory: src/Web

      - name: Test
        if: steps.spa.outputs.present == 'true'
        run: npm test -- --run
        working-directory: src/Web

  infra:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        # Deliberately unpinned: an older Bicep does not know newer API versions and downgrades unknown-type errors to BCP081 warnings.
        run: az bicep install

      - name: Show Bicep version
        run: az bicep version

      - name: Build main.bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Build main.bicepparam
        env:
          PAGES_ORIGIN: https://example.github.io
          API_IMAGE: example.azurecr.io/stockportfolio-api:ci
          MIGRATOR_IMAGE: example.azurecr.io/stockportfolio-migrator:ci
          PG_ADMIN_PASSWORD: ci-placeholder-not-a-real-password
          MIGRATOR_PW: ci-placeholder-not-a-real-password
          IDENTITY_PW: ci-placeholder-not-a-real-password
          PORTFOLIO_PW: ci-placeholder-not-a-real-password
          MARKETDATA_PW: ci-placeholder-not-a-real-password
          ALERTS_PW: ci-placeholder-not-a-real-password
          FINNHUB_API_KEY: ''
        run: az bicep build-params --file infra/main.bicepparam --stdout > /dev/null

      # Deliberately absent: `az deployment group what-if` needs a login, which a fork's pull request cannot have.
