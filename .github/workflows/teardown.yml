name: Teardown

# Deletes the Azure resource group once its `deleteAfter` tag has passed.
#
# WHY THIS EXISTS. The subscription is pay-as-you-go. Azure offers no spending limit on that offer
# type, and an Azure budget cannot stop spending -- it only sends email. So the cost ceiling is not
# enforced by watching money, it is enforced by bounding time: deploy.yml stamps `deleteAfter` on
# the resource group, and this workflow is what makes that stamp mean something.
#
# THIS WORKFLOW IS THE ONLY THING STANDING BETWEEN A FORGOTTEN DEPLOY AND AN OPEN-ENDED BILL.
# If it silently stops working, nothing else notices. That is why the decide step below refuses to
# run rather than guessing, and why the spec requires proving it against a throwaway group before
# trusting it.
#
# Known limitation: GitHub disables scheduled workflows in repositories with 60 days of no
# activity. Irrelevant at a 14-day window, but it is the reason a budget alert still exists as an
# independent backstop.

on:
  schedule:
    # 03:00 UTC daily. Cost accrues hourly, so the exact time does not matter; a daily granularity
    # costs at most one extra day (~$1.26) versus checking continuously.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Delete now, ignoring the deleteAfter tag'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: teardown
  cancel-in-progress: false

jobs:
  teardown:
    name: Delete resource group if past deadline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read deadline
        id: read
        run: |
          set -euo pipefail
          RG='${{ vars.AZURE_RESOURCE_GROUP }}'

          # "Absent" and "cannot see it" are NOT the same answer, and conflating them is how this
          # workflow reports success at exactly the moment it has stopped working. An expired
          # credential or a revoked role assignment would look identical to a tidy, already-deleted
          # resource group -- green run, no resources torn down, bill still accruing. So the error
          # is inspected rather than swallowed, and anything that is not a clean not-found fails.
          set +e
          ERR=$(az group show --name "$RG" --output none 2>&1)
          RC=$?
          set -e

          if [ $RC -ne 0 ]; then
            if echo "$ERR" | grep -qiE "ResourceGroupNotFound|could not be found|was not found"; then
              echo "Resource group $RG does not exist. Nothing to do."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Cannot read resource group '$RG'. This is not the same as it being absent - the teardown guard is blind, not idle. Failing loudly so the cost ceiling does not silently stop being enforced."
            echo "$ERR"
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

          # Empty string if the tag is absent. Deliberately not defaulted to anything here -- what
          # to do about a missing deadline is the decision below, not a default hidden in a shell
          # parameter expansion.
          DELETE_AFTER=$(az group show --name "$RG" --query "tags.deleteAfter" -o tsv 2>/dev/null || true)
          [ "$DELETE_AFTER" = "None" ] && DELETE_AFTER=""

          echo "deleteAfter=$DELETE_AFTER" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)"  >> "$GITHUB_OUTPUT"
          echo "Resource group : $RG"
          echo "deleteAfter    : ${DELETE_AFTER:-<absent>}"
          echo "today (UTC)    : $(date -u +%Y-%m-%d)"

      # -------------------------------------------------------------------------------------------
      # An unreadable deadline DELETES. That is a deliberate choice, not an oversight.
      #
      # The alternative -- skip when the tag is missing -- never destroys anything unexpectedly,
      # but it fails in the quiet direction: one typo in the tag name and the only cost guarantee
      # on this subscription is silently doing nothing, discovered when the bill arrives. Deleting
      # fails in the loud direction. The data here is disposable and a redeploy is one workflow
      # run; an unbounded bill on a personal pay-as-you-go card is not recoverable in one run.
      #
      # Dates are ISO-8601, so lexical comparison is chronological and no date parsing is needed.
      # The comparison is >=, not >, so the group dies ON the stamped date -- exactly the
      # TEARDOWN_DAYS window advertised in deploy.yml rather than one day more.
      # -------------------------------------------------------------------------------------------
      - name: Decide
        id: decide
        if: steps.read.outputs.exists == 'true'
        run: |
          set -euo pipefail
          DELETE_AFTER='${{ steps.read.outputs.deleteAfter }}'
          TODAY='${{ steps.read.outputs.today }}'

          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "Forced by manual dispatch, ignoring deleteAfter."
            echo "should_delete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "$DELETE_AFTER" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::warning::deleteAfter is missing or malformed ('$DELETE_AFTER') - deleting, because a group with no readable deadline is a group nothing is bounding."
            echo "should_delete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$TODAY" < "$DELETE_AFTER" ]]; then
            echo "Deadline reached: today $TODAY >= deleteAfter $DELETE_AFTER."
            echo "should_delete=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet: today $TODAY < deleteAfter $DELETE_AFTER."
            echo "should_delete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete resource group
        if: steps.decide.outputs.should_delete == 'true'
        run: |
          set -euo pipefail
          RG='${{ vars.AZURE_RESOURCE_GROUP }}'
          echo "Deleting resource group $RG"
          # Not --no-wait: the run should stay red if the delete fails, rather than reporting
          # success for an operation that was merely accepted.
          az group delete --name "$RG" --yes --output none
          echo "Deleted. Re-deploy with the Deploy workflow when needed."

      - name: Report
        if: always() && steps.read.outputs.exists == 'true'
        run: |
          echo "should_delete = ${{ steps.decide.outputs.should_delete }}"
          echo "deleteAfter   = ${{ steps.read.outputs.deleteAfter }}"
          echo "today         = ${{ steps.read.outputs.today }}"
