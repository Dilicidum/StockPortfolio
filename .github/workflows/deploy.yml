name: Deploy

# Deploys the API to Azure Container Apps and the SPA to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NAME_PREFIX: stockp
  API_IMAGE_NAME: stockportfolio-api
  MIGRATOR_IMAGE_NAME: stockportfolio-migrator
  TEARDOWN_DAYS: 14

jobs:
  azure:
    name: Azure — build, migrate, release
    runs-on: ubuntu-latest
    outputs:
      apiUrl: ${{ steps.deploy.outputs.apiUrl }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      # Stamped before the deploy, so a run that fails halfway still leaves a bounded resource group.
      - name: Stamp teardown deadline
        run: |
          set -euo pipefail
          DELETE_AFTER=$(date -u -d "+${{ env.TEARDOWN_DAYS }} days" +%Y-%m-%d)
          echo "Resource group will be torn down on or after $DELETE_AFTER"
          az group update \
            --name '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --set "tags.deleteAfter=$DELETE_AFTER" \
            --output none

      # main.bicep references images that cannot be pushed until the registry exists, so acr.bicep is deployed alone first.
      - name: Bootstrap container registry
        id: registry
        run: |
          set -euo pipefail
          OUT=$(az deployment group create \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name "acr-bootstrap-${{ github.run_number }}" \
            --template-file infra/modules/acr.bicep \
            --parameters namePrefix='${{ env.NAME_PREFIX }}' location='${{ vars.AZURE_LOCATION }}' \
            --query properties.outputs -o json)
          echo "name=$(echo "$OUT" | jq -r '.name.value')" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(echo "$OUT" | jq -r '.loginServer.value')" >> "$GITHUB_OUTPUT"
          echo "Registry: $(echo "$OUT" | jq -r '.loginServer.value')"

      - name: Log in to ACR
        run: az acr login --name '${{ steps.registry.outputs.name }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Host/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.loginServer }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.registry.outputs.loginServer }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Migrator/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.loginServer }}/${{ env.MIGRATOR_IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.registry.outputs.loginServer }}/${{ env.MIGRATOR_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lowercased: a browser's Origin header is lowercase, so a mixed-case owner never matches the CORS policy.
      - name: Compute Pages origin
        id: pages
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "origin=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"

      # Secrets reach `az` through a file, never through argv.
      - name: Write deployment parameters
        env:
          LOCATION: ${{ vars.AZURE_LOCATION }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          API_IMAGE: ${{ steps.registry.outputs.loginServer }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          MIGRATOR_IMAGE: ${{ steps.registry.outputs.loginServer }}/${{ env.MIGRATOR_IMAGE_NAME }}:${{ github.sha }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          MIGRATOR_PW: ${{ secrets.MIGRATOR_PW }}
          IDENTITY_PW: ${{ secrets.IDENTITY_PW }}
          PORTFOLIO_PW: ${{ secrets.PORTFOLIO_PW }}
          MARKETDATA_PW: ${{ secrets.MARKETDATA_PW }}
          ALERTS_PW: ${{ secrets.ALERTS_PW }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          jq -n '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            contentVersion: "1.0.0.0",
            parameters: {
              namePrefix:            { value: env.NAME_PREFIX },
              location:              { value: env.LOCATION },
              pagesOrigin:           { value: env.PAGES_ORIGIN },
              apiImage:              { value: env.API_IMAGE },
              migratorImage:         { value: env.MIGRATOR_IMAGE },
              postgresAdminPassword: { value: env.PG_ADMIN_PASSWORD },
              migratorPassword:      { value: env.MIGRATOR_PW },
              identityPassword:      { value: env.IDENTITY_PW },
              portfolioPassword:     { value: env.PORTFOLIO_PW },
              marketDataPassword:    { value: env.MARKETDATA_PW },
              alertsPassword:        { value: env.ALERTS_PW },
              finnhubApiKey:         { value: (env.FINNHUB_API_KEY // "") },
              byokEnabled:           { value: true }
            }
          }' > "$RUNNER_TEMP/deploy-params.json"

          echo "parameters written: $(jq -r '.parameters | keys | length' "$RUNNER_TEMP/deploy-params.json")"
          jq -r '.parameters | keys | join(", ")' "$RUNNER_TEMP/deploy-params.json"

      - name: What-if
        # Not a gate — the deploy is unattended. It is here so the run log records what changed.
        run: |
          az deployment group what-if \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --template-file infra/main.bicep \
            --parameters "@$RUNNER_TEMP/deploy-params.json"

      - name: Deploy infrastructure
        id: deploy
        run: |
          set -euo pipefail
          OUT=$(az deployment group create \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name "stockportfolio-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters "@$RUNNER_TEMP/deploy-params.json" \
            --query properties.outputs -o json)

          echo "containerAppName=$(echo "$OUT" | jq -r '.containerAppName.value')" >> "$GITHUB_OUTPUT"
          echo "migrateJobName=$(echo "$OUT"   | jq -r '.migrateJobName.value')"   >> "$GITHUB_OUTPUT"
          echo "apiUrl=$(echo "$OUT"           | jq -r '.apiUrl.value')"           >> "$GITHUB_OUTPUT"
          echo "postgresFqdn=$(echo "$OUT"     | jq -r '.postgresFqdn.value')"     >> "$GITHUB_OUTPUT"

      - name: Remove deployment parameters
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-params.json"

      # Flexible Server has no docker-entrypoint-initdb.d, so the roles are applied by running the same db/init/00-roles.sh unmodified.
      - name: Open Postgres firewall for this runner
        id: pgfirewall
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -s --fail https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          RULE="gh-runner-${{ github.run_id }}"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --server-name "$(echo '${{ steps.deploy.outputs.postgresFqdn }}' | cut -d. -f1)" \
            --name "$RULE" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Apply roles, schemas and grants
        env:
          PGHOST: ${{ steps.deploy.outputs.postgresFqdn }}
          PGPASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          PGSSLMODE: require
          POSTGRES_USER: pgadmin
          POSTGRES_DB: stockportfolio
          MIGRATOR_PW: ${{ secrets.MIGRATOR_PW }}
          IDENTITY_PW: ${{ secrets.IDENTITY_PW }}
          PORTFOLIO_PW: ${{ secrets.PORTFOLIO_PW }}
          MARKETDATA_PW: ${{ secrets.MARKETDATA_PW }}
          ALERTS_PW: ${{ secrets.ALERTS_PW }}
        run: bash db/init/00-roles.sh

      - name: Close Postgres firewall for this runner
        # always(): otherwise every failed deploy leaves a permanent hole for a recycled runner address.
        if: always() && steps.pgfirewall.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --server-name "$(echo '${{ steps.deploy.outputs.postgresFqdn }}' | cut -d. -f1)" \
            --name '${{ steps.pgfirewall.outputs.rule }}' \
            --yes --output none || true

      # Nothing goes live until this succeeds.
      - name: Run migration job
        run: |
          set -euo pipefail
          JOB='${{ steps.deploy.outputs.migrateJobName }}'
          RG='${{ vars.AZURE_RESOURCE_GROUP }}'

          EXECUTION=$(az containerapp job start --name "$JOB" --resource-group "$RG" --query name -o tsv)
          echo "Started execution: $EXECUTION"

          # `az containerapp job start` returns as soon as the execution is queued, so only polling gates the release.
          DEADLINE=$(( SECONDS + 900 ))
          while true; do
            STATUS=$(az containerapp job execution show \
              --name "$JOB" --resource-group "$RG" --job-execution-name "$EXECUTION" \
              --query properties.status -o tsv)
            echo "  status: $STATUS"
            case "$STATUS" in
              Succeeded)
                break
                ;;
              Failed|Degraded)
                echo "::error::Migration job execution $EXECUTION finished with status $STATUS"
                az containerapp job logs show --name "$JOB" --resource-group "$RG" \
                  --container migrate --tail 200 || true
                exit 1
                ;;
            esac
            if [ "$SECONDS" -gt "$DEADLINE" ]; then
              echo "::error::Timed out waiting for migration job execution $EXECUTION"
              exit 1
            fi
            sleep 10
          done
          echo "Migrations applied."

      # Near a no-op normally; it earns its place when ARM skips the deployment as unchanged while the digest behind the tag moved.
      - name: Update container app image
        run: |
          az containerapp update \
            --name '${{ steps.deploy.outputs.containerAppName }}' \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --image '${{ steps.registry.outputs.loginServer }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}' \
            --output none

      # Four databases by name, never the overall status: redis is registered degraded, so the overall status can read Degraded while every database is fine.
      - name: Smoke test readiness
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.apiUrl }}/health/ready'
          BODY="$RUNNER_TEMP/health-ready.json"

          READY=0
          for _ in $(seq 1 30); do
            CODE=$(curl -s -o "$BODY" -w '%{http_code}' "$URL" || echo 000)
            echo "  $URL -> $CODE"
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            sleep 10
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::$URL never returned 200"
            exit 1
          fi

          # An HTML error page from a proxy also arrives as a 200, so parse before asserting.
          if ! jq -e . "$BODY" > /dev/null 2>&1; then
            echo "::error::$URL answered 200 with a body that is not JSON: $(head -c 500 "$BODY" | tr -d '\r\n')"
            exit 1
          fi

          echo "readiness body: $(jq -c . "$BODY")"

          FAILED=0
          for COMPONENT in postgres-identity postgres-portfolio postgres-marketdata postgres-alerts; do
            # `[...][0] // "missing"` makes an absent component a failure rather than an empty string.
            STATUS=$(jq -r --arg name "$COMPONENT" \
              '[.components[]? | select(.name == $name) | .status][0] // "missing"' "$BODY")
            echo "  $COMPONENT -> $STATUS"
            if [ "$STATUS" != "Healthy" ]; then FAILED=1; fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$URL returned 200 but a database component is not Healthy: $(jq -c . "$BODY")"
            exit 1
          fi

          echo "All four database components are Healthy."

  # Runs after the API is live so VITE_API_BASE_URL can be the just-deployed FQDN.
  pages:
    name: GitHub Pages — build and publish SPA
    runs-on: ubuntu-latest
    needs: azure
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci
        working-directory: src/Web

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ needs.azure.outputs.apiUrl }}
        run: npm run build
        working-directory: src/Web

      - name: Create 404.html for SPA history routing
        run: cp src/Web/dist/index.html src/Web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/Web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
