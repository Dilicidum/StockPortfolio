# =============================================================================
#  StockPortfolio - nginx site config (mounted as conf.d/default.conf)
#
#  Serves the built SPA at / and proxies /api to the API container. Same origin,
#  which is why the compose deployment can keep the refresh token in an httpOnly
#  cookie while the GitHub Pages deployment cannot.
# =============================================================================

upstream api {
    # Resolved once at startup, so the web service depends_on api. `api` is the
    # compose service name.
    server api:8080;
    keepalive 16;
}

# No `map $http_upgrade` anywhere in this file, and that is deliberate. The alert
# hub is the only thing that upgrades, so its location hardcodes `Connection:
# upgrade` instead. A shared map would derive `Connection: close` from an empty
# $http_upgrade on every ordinary API call and defeat the upstream keepalive above.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Static text compresses well; the SSE location below turns this back off
    # for itself, because a compressed event stream is a buffered event stream.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- container healthcheck ---------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- the alert hub, over WebSockets -------------------------------------
    # The client is pinned to WebSockets and skips SignalR's negotiate step, so
    # this location only ever sees an upgrade request - which is what lets the
    # two headers below be hardcoded rather than derived from a shared map.
    # nginx's default proxy_read_timeout is 60s, STRICTER than the container
    # platform's 240s idle timeout, so without the timeouts here the local stack
    # breaks before production does. Longer prefix than /api/, so nginx matches
    # it first regardless of order.
    location /api/alerts/stream {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API ----------------------------------------------------------------
    # No URI part after the upstream name, so the full original path including
    # the /api prefix is forwarded: /api/auth/login stays /api/auth/login.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Connection        '';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Health endpoints, handy for `curl localhost:5173/health/ready`.
    location /health/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- SPA ----------------------------------------------------------------
    # Content-hashed bundles: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy leaves clients pointing at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: every unknown path is a TanStack Router route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
